version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: polza_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polza_companies
      POSTGRES_USER: polza
      POSTGRES_PASSWORD: polza_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  pgdata:
